server {
    listen 80;
    server_name _;

    # DNS embebido de Docker.
    #
    # POR QUE ESTO EXISTE (bug real, medido el 2026-07-16): con un hostname
    # literal en proxy_pass ("http://api:8000"), nginx resuelve "api" UNA sola
    # vez al arrancar y cachea esa IP PARA SIEMPRE. Cada vez que el contenedor
    # api se recrea -- un deploy, un crash, un reinicio -- cambia de IP y nginx
    # sigue hablando con la muerta: el dashboard carga pero TODAS sus llamadas a
    # /api y el WebSocket devuelven 502, hasta que alguien reinicia nginx.
    # Observado: api paso de 172.18.0.4 a 172.18.0.5 y nginx seguia insistiendo
    # en .4 ("connect() failed (111: Connection refused) ... upstream:
    # http://172.18.0.4:8000") mientras el DNS de Docker resolvia .5
    # correctamente. El fallo era 100% del cache interno de nginx.
    #
    # La cura son las DOS lineas juntas: este `resolver` + la VARIABLE en
    # proxy_pass (abajo). Un proxy_pass con variable obliga a nginx a resolver
    # en cada peticion en vez de al arrancar. Solo con el resolver no basta.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API REST -> contenedor api
    # Regex con captura a proposito: al usar una variable en proxy_pass, nginx
    # deja de hacer la sustitucion automatica del prefijo del location, asi que
    # el resto de la ruta se reconstruye a mano ($1) junto con el query string.
    location ~ ^/api/(.*)$ {
        set $api_host api;
        proxy_pass http://$api_host:8000/$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # WebSocket de logs/eventos en tiempo real -> contenedor api
    location ~ ^/ws(.*)$ {
        set $api_host api;
        proxy_pass http://$api_host:8000/ws$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # SPA / estaticos. Los location regex de arriba tienen prioridad sobre este
    # prefijo, asi que /api y /ws nunca caen aqui.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
